<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIVE BREACH</title>
<style>
html,body{margin:0;height:100%;background:#05070a;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh;cursor:none;outline:none}
</style>

<body>
<canvas id="c" tabindex="0"></canvas>
<script>
(function(){
'use strict';
/* ================= HIVE BREACH - single-file top-down arcade shooter ================= */
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var TAU=Math.PI*2,DT=1/60;
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rand(a,b){return a+Math.random()*(b-a);}
function randi(a,b){return Math.floor(rand(a,b+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

/* ---------- screen ---------- */
var W=1,H=1,S=1,LW=1,LH=1,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);
  S=clamp(Math.min(W/1100,H/680),0.45,1.7);
  LW=W/S;LH=H/S;
}
window.addEventListener('resize',resize);resize();

/* ---------- audio (Web Audio, fully synthesized) ---------- */
var AC=null,master=null,noiseBuf=null,muted=false,sfxLast={};
function audioInit(){
  if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
  try{
    var Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return;
    AC=new Ctor();
    master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    startDrone();
  }catch(e){AC=null;}
}
function tone(f,dur,type,vol,f2,delay){
  if(!AC)return;
  var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
}
function noise(dur,vol,freq,ftype,f2,delay){
  if(!AC)return;
  var t=AC.currentTime+(delay||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;s.loop=true;fl.type=ftype||'lowpass';fl.frequency.setValueAtTime(freq,t);
  if(f2)fl.frequency.exponentialRampToValueAtTime(Math.max(10,f2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03);
}
function startDrone(){
  try{
    var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=150;
    var g=AC.createGain();g.gain.value=0.16;f.connect(g);g.connect(master);
    [55,55.6,82.6].forEach(function(fr,i){var o=AC.createOscillator();o.type=i<2?'sawtooth':'triangle';o.frequency.value=fr;o.connect(f);o.start();});
    var l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=0.13;lg.gain.value=70;l.connect(lg);lg.connect(f.frequency);l.start();
    var l2=AC.createOscillator(),lg2=AC.createGain();l2.frequency.value=0.5;lg2.gain.value=0.05;l2.connect(lg2);lg2.connect(g.gain);l2.start();
  }catch(e){}
}
var SFX_GAP={hit:45,die:35,pick:40,spit:120,wallhit:60,crate:50,mg:0,flame:70,boom:60,screech:650,growl:900};
function sfx(n){
  if(!AC||muted)return;
  var now=performance.now(),gap=SFX_GAP[n]||0;
  if(gap&&now-(sfxLast[n]||0)<gap)return;sfxLast[n]=now;
  switch(n){
    case 'pistol':tone(520,0.09,'square',0.16,140);noise(0.07,0.18,2600,'highpass');break;
    case 'shotgun':noise(0.28,0.5,1400,'lowpass',180);tone(150,0.2,'sawtooth',0.28,40);break;
    case 'mg':tone(rand(300,360),0.05,'square',0.11,110);noise(0.045,0.16,3200,'highpass');break;
    case 'empty':tone(900,0.03,'square',0.08);break;
    case 'hit':tone(rand(180,260),0.06,'sawtooth',0.07,70);break;
    case 'die':noise(0.16,0.2,900,'lowpass',160);tone(rand(240,340),0.14,'sawtooth',0.1,50);break;
    case 'pick':tone(660,0.07,'square',0.1);tone(990,0.09,'square',0.1,0,0.06);break;
    case 'heal':tone(440,0.09,'triangle',0.2);tone(660,0.09,'triangle',0.2,0,0.08);tone(880,0.14,'triangle',0.2,0,0.16);break;
    case 'ammo':tone(300,0.05,'square',0.12);tone(450,0.08,'square',0.12,0,0.05);break;
    case 'hurt':tone(140,0.22,'sawtooth',0.3,45);noise(0.14,0.22,500,'lowpass');break;
    case 'crate':noise(0.2,0.3,700,'lowpass',120);tone(110,0.1,'square',0.12,50);break;
    case 'wallhit':noise(0.04,0.07,4000,'highpass');break;
    case 'spit':tone(420,0.16,'sine',0.14,120);break;
    case 'switch':tone(700,0.035,'square',0.08);break;
    case 'dash':noise(0.2,0.25,500,'bandpass',3200);tone(220,0.16,'sine',0.1,520);break;
    case 'flame':noise(0.12,0.16,900,'lowpass',300);break;
    case 'thump':tone(190,0.16,'sine',0.4,55);noise(0.08,0.2,800,'lowpass');break;
    case 'boom':noise(0.55,0.6,700,'lowpass',50);tone(85,0.5,'sine',0.5,28);break;
    case 'screech':tone(rand(900,1300),0.22,'sawtooth',0.05,rand(280,420));break;
    case 'growl':tone(70,0.5,'sawtooth',0.14,42);noise(0.4,0.08,260,'lowpass');break;
    case 'heart':tone(62,0.12,'sine',0.5,40);tone(58,0.12,'sine',0.4,38,0.16);break;
    case 'dual':tone(500,0.04,'square',0.1);tone(760,0.05,'square',0.1,0,0.05);break;
    case 'buy':tone(520,0.07,'square',0.13);tone(780,0.07,'square',0.13,0,0.07);tone(1040,0.12,'square',0.13,0,0.14);break;
    case 'deny':tone(130,0.16,'square',0.14);break;
    case 'wave':tone(330,0.3,'sawtooth',0.16,660);tone(330,0.3,'sawtooth',0.16,660,0.34);tone(440,0.45,'sawtooth',0.16,880,0.68);break;
    case 'clear':tone(523,0.12,'square',0.13);tone(659,0.12,'square',0.13,0,0.12);tone(784,0.24,'square',0.13,0,0.24);break;
    case 'roar':tone(90,0.9,'sawtooth',0.4,38);noise(0.9,0.3,420,'lowpass',90);break;
    case 'over':tone(330,0.3,'sawtooth',0.22,160);tone(220,0.35,'sawtooth',0.22,110,0.3);tone(120,0.9,'sawtooth',0.26,45,0.65);break;
    case 'win':[523,659,784,1047,1319].forEach(function(f,i){tone(f,0.24,'square',0.14,0,i*0.15);});break;
  }
}

/* ---------- map ---------- */
var T=60,MW=40,MH=30,WW=MW*T,WH=MH*T;
var solid=new Uint8Array(MW*MH);          // 0 free, 1 wall, 2 crate
var crateAt=new Array(MW*MH);
var wallRects=[],crates=[],vents=[];
function addWall(tx,ty,tw,th,kind){
  wallRects.push({x:tx*T,y:ty*T,w:tw*T,h:th*T,kind:kind,n:wallRects.length});
  for(var y=ty;y<ty+th;y++)for(var x=tx;x<tx+tw;x++)solid[y*MW+x]=1;
}
addWall(0,0,MW,1,'border');addWall(0,MH-1,MW,1,'border');addWall(0,1,1,MH-2,'border');addWall(MW-1,1,1,MH-2,'border');
[[8,8,8,1,'glass'],[24,8,8,1,'glass'],[8,21,8,1,'glass'],[24,21,8,1,'glass'],[12,12,1,6,'glass'],[27,12,1,6,'glass'],
 [5,14,2,2,'tank'],[33,14,2,2,'tank'],[19,4,2,2,'tank'],[19,24,2,2,'tank'],
 [17,12,1,1,'rack'],[22,12,1,1,'rack'],[17,17,1,1,'rack'],[22,17,1,1,'rack'],
 [4,4,1,3,'bench'],[35,4,1,3,'bench'],[4,23,1,3,'bench'],[35,23,1,3,'bench']].forEach(function(w){addWall(w[0],w[1],w[2],w[3],w[4]);});
var DOORS=[{x:30*T,y:T/2,h:true},{x:10*T,y:WH-T/2,h:true},{x:T/2,y:8*T,h:false},{x:WW-T/2,y:22*T,h:false}];
var FLICK=[{x:420,y:420},{x:1980,y:1380},{x:1200,y:420},{x:420,y:1320},{x:1900,y:520}];
[[2,2],[20,1],[37,2],[38,15],[37,27],[20,28],[2,27],[1,15]].forEach(function(v){
  vents.push({tx:v[0],ty:v[1],x:(v[0]+0.5)*T,y:(v[1]+0.5)*T});
});
function genCrates(){
  var i;for(i=0;i<solid.length;i++){if(solid[i]===2)solid[i]=0;crateAt[i]=null;}
  crates.length=0;
  function tryAdd(tx,ty,barrel){
    if(tx<2||ty<2||tx>MW-3||ty>MH-3)return false;
    var idx=ty*MW+tx;if(solid[idx])return false;
    if(Math.abs(tx-19.5)<3.6&&Math.abs(ty-14.5)<3.6)return false;
    for(var k=0;k<vents.length;k++)if(Math.abs(tx-vents[k].tx)<=2&&Math.abs(ty-vents[k].ty)<=2)return false;
    var c=barrel?{tx:tx,ty:ty,x:tx*T+11,y:ty*T+11,w:38,h:38,hp:16,hit:0,dead:false,v:0,barrel:true,fuse:0}
                :{tx:tx,ty:ty,x:tx*T+7,y:ty*T+7,w:46,h:46,hp:40,hit:0,dead:false,v:randi(0,2),barrel:false,fuse:0};
    crates.push(c);solid[idx]=2;crateAt[idx]=c;return true;
  }
  var tries=0,n=0;
  while(n<32&&tries++<3000){
    var tx=randi(2,MW-3),ty=randi(2,MH-3);
    if(tryAdd(tx,ty,false)){n++;if(Math.random()<0.4){if(tryAdd(tx+(Math.random()<0.5?1:0),ty+1,false))n++;}}
  }
  tries=0;n=0;
  while(n<12&&tries++<3000){if(tryAdd(randi(2,MW-3),randi(2,MH-3),true))n++;}
}
/* baked floor + persistent decal layer */
var floorC=document.createElement('canvas');floorC.width=WW;floorC.height=WH;
var decC=document.createElement('canvas');decC.width=WW;decC.height=WH;
var decG=decC.getContext('2d');
function glowSprite(rgb){
  var c=document.createElement('canvas');c.width=c.height=128;
  var g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba('+rgb+',1)');gr.addColorStop(0.4,'rgba('+rgb+',0.45)');gr.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);return c;
}
var SPR_W=glowSprite('205,232,255'),SPR_R=glowSprite('255,50,40'),SPR_G=glowSprite('80,255,130');
function bakeFloor(){
  var g=floorC.getContext('2d'),x,y,i,k;
  // sterile lab tiles with a half-tile seam
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){
    var v=Math.floor(rand(0,6));
    g.fillStyle='rgb('+(27+v)+','+(34+v)+','+(42+v)+')';g.fillRect(x*T,y*T,T,T);
    g.fillStyle='rgba(255,255,255,0.025)';g.fillRect(x*T+2,y*T+2,T/2-3,T/2-3);g.fillRect(x*T+T/2+1,y*T+T/2+1,T/2-3,T/2-3);
    if(Math.random()<0.05){g.fillStyle='rgba(0,0,0,0.25)';g.fillRect(x*T+5,y*T+5,T-10,T-10);}
  }
  g.strokeStyle='rgba(12,18,24,0.9)';g.lineWidth=2;g.beginPath();
  for(x=0;x<=MW;x++){g.moveTo(x*T,0);g.lineTo(x*T,WH);}
  for(y=0;y<=MH;y++){g.moveTo(0,y*T);g.lineTo(WW,y*T);}
  g.stroke();
  g.strokeStyle='rgba(120,150,170,0.07)';g.lineWidth=1;g.beginPath();
  for(x=0;x<MW;x++){g.moveTo(x*T+T/2,0);g.lineTo(x*T+T/2,WH);}
  for(y=0;y<MH;y++){g.moveTo(0,y*T+T/2);g.lineTo(WW,y*T+T/2);}
  g.stroke();
  // lab sectors: tint, dashed boundary, stencilled names
  var Z=[
    {x:1,y:1,w:11,h:28,rgb:'70,220,120',name:'BIO LAB',code:'SECTOR A',lx:6.5,ly:11},
    {x:28,y:1,w:11,h:28,rgb:'90,200,255',name:'CRYO STORAGE',code:'SECTOR B',lx:33.5,ly:11},
    {x:12,y:1,w:16,h:7,rgb:'190,120,255',name:'SPECIMEN HOLDING',code:'SECTOR C',lx:20,ly:2.6},
    {x:12,y:22,w:16,h:7,rgb:'255,170,60',name:'REACTOR CONTROL',code:'SECTOR D',lx:20,ly:27},
    {x:13,y:9,w:14,h:12,rgb:'47,245,192',name:'CONTAINMENT HUB',code:'SUBLEVEL 9',lx:20,ly:19.6}
  ];
  g.textAlign='center';g.textBaseline='middle';
  Z.forEach(function(z){
    g.fillStyle='rgba('+z.rgb+',0.055)';g.fillRect(z.x*T,z.y*T,z.w*T,z.h*T);
    g.strokeStyle='rgba('+z.rgb+',0.4)';g.lineWidth=4;g.setLineDash([26,18]);
    g.strokeRect(z.x*T+12,z.y*T+12,z.w*T-24,z.h*T-24);g.setLineDash([]);
    g.font='bold 46px "Consolas","Courier New",monospace';g.fillStyle='rgba('+z.rgb+',0.2)';g.fillText(z.name,z.lx*T,z.ly*T);
    g.font='bold 18px "Consolas","Courier New",monospace';g.fillStyle='rgba('+z.rgb+',0.3)';g.fillText(z.code,z.lx*T,z.ly*T+38);
  });
  // yellow walkway guide lines through the hub
  g.strokeStyle='rgba(240,200,50,0.3)';g.lineWidth=5;g.setLineDash([40,24]);g.beginPath();
  g.moveTo(T+20,900);g.lineTo(WW-T-20,900);g.moveTo(1200,T+20);g.lineTo(1200,WH-T-20);g.stroke();g.setLineDash([]);
  // containment ring
  g.strokeStyle='rgba(47,245,192,0.45)';g.lineWidth=6;g.beginPath();g.arc(1200,900,150,0,TAU);g.stroke();
  g.lineWidth=2;g.beginPath();g.arc(1200,900,120,0,TAU);g.stroke();
  for(i=0;i<12;i++){var aa=i*TAU/12;g.fillStyle=i%2?'rgba(240,200,50,0.45)':'rgba(20,20,20,0.6)';g.beginPath();g.arc(1200,900,150,aa,aa+TAU/12);g.arc(1200,900,135,aa+TAU/12,aa,true);g.fill();}
  // overhead light pools
  g.globalAlpha=0.16;
  for(y=3;y<MH;y+=5)for(x=3;x<MW;x+=5)g.drawImage(SPR_W,x*T-200,y*T-200,400,400);
  g.globalAlpha=1;
  // cryo frost, bio hazard emblems, drains
  for(i=0;i<26;i++){g.fillStyle='rgba(220,245,255,'+rand(0.03,0.09)+')';g.beginPath();g.arc(rand(29*T,38*T),rand(2*T,28*T),rand(20,70),0,TAU);g.fill();}
  [[6.5*T,7.5*T],[6.5*T,19.5*T]].forEach(function(b){
    g.strokeStyle='rgba(70,220,120,0.4)';g.lineWidth=7;
    for(k=0;k<3;k++){var ba=k*TAU/3-Math.PI/2;g.beginPath();g.arc(b[0]+Math.cos(ba)*26,b[1]+Math.sin(ba)*26,24,0,TAU);g.stroke();}
    g.fillStyle='rgba(70,220,120,0.4)';g.beginPath();g.arc(b[0],b[1],9,0,TAU);g.fill();
  });
  for(i=0;i<14;i++){
    var dx=randi(2,MW-3)*T+30,dy=randi(2,MH-3)*T+30;
    g.fillStyle='#0b1014';g.fillRect(dx-11,dy-11,22,22);g.strokeStyle='#44525e';g.lineWidth=2;g.strokeRect(dx-11,dy-11,22,22);
    g.beginPath();for(k=-6;k<=6;k+=4){g.moveTo(dx-8,dy+k);g.lineTo(dx+8,dy+k);}g.stroke();
  }
  // signs of what happened: old blood trails, scattered papers, grime
  for(i=0;i<12;i++){
    var bx=rand(2*T,WW-2*T),by=rand(2*T,WH-2*T),ba2=rand(0,TAU),bl=rand(60,220);
    for(k=0;k<26;k++){var t=k/26;g.fillStyle='rgba(120,12,12,'+rand(0.12,0.3)+')';g.beginPath();
      g.arc(bx+Math.cos(ba2)*bl*t+rand(-7,7),by+Math.sin(ba2)*bl*t+rand(-7,7),rand(3,11)*(1-t*0.6),0,TAU);g.fill();}
  }
  for(i=0;i<90;i++){
    g.save();g.translate(rand(T,WW-T),rand(T,WH-T));g.rotate(rand(0,TAU));
    g.fillStyle='rgba(225,232,236,'+rand(0.3,0.6)+')';g.fillRect(-8,-11,16,22);
    g.fillStyle='rgba(60,70,80,0.5)';g.fillRect(-5,-7,10,1.5);g.fillRect(-5,-3,10,1.5);g.fillRect(-5,1,7,1.5);g.restore();
  }
  for(i=0;i<200;i++){g.fillStyle='rgba(0,0,0,'+rand(0.04,0.12)+')';g.beginPath();g.arc(rand(0,WW),rand(0,WH),rand(8,46),0,TAU);g.fill();}
  // breached vents
  vents.forEach(function(vn){
    g.save();g.translate(vn.x,vn.y);
    g.save();g.beginPath();g.rect(-56,-56,112,112);g.clip();
    g.fillStyle='#1a1608';g.fillRect(-56,-56,112,112);
    g.strokeStyle='rgba(240,180,30,0.55)';g.lineWidth=9;g.beginPath();
    for(var q=-160;q<160;q+=28){g.moveTo(q,-60);g.lineTo(q+112,60);}
    g.stroke();g.restore();
    g.fillStyle='#020405';g.fillRect(-34,-34,68,68);
    g.strokeStyle='#3c4d5c';g.lineWidth=3;g.strokeRect(-34,-34,68,68);
    g.strokeStyle='#243240';g.lineWidth=4;g.beginPath();
    for(var s2=-24;s2<=24;s2+=12){g.moveTo(-30,s2);g.lineTo(30+rand(-14,0),s2+rand(-5,5));}
    g.stroke();
    for(var q2=0;q2<14;q2++){g.fillStyle='rgba(88,214,42,'+rand(0.2,0.5)+')';g.beginPath();g.arc(rand(-60,60),rand(-60,60),rand(2,9),0,TAU);g.fill();}
    g.restore();
  });
  // ----- walls and lab fixtures -----
  wallRects.forEach(function(w){
    var X=w.x,Y=w.y,Wd=w.w,Hd=w.h,horiz=Wd>=Hd,cx=X+Wd/2,cy=Y+Hd/2;
    if(w.kind==='border'){
      g.fillStyle='#12171c';g.fillRect(X,Y,Wd,Hd);
      g.fillStyle='#2a343e';g.fillRect(X+5,Y+5,Wd-10,Hd-10);
      g.strokeStyle='rgba(0,0,0,0.45)';g.lineWidth=2;g.beginPath();
      if(horiz)for(k=X+T;k<X+Wd;k+=T){g.moveTo(k,Y+5);g.lineTo(k,Y+Hd-5);}
      else for(k=Y+T;k<Y+Hd;k+=T){g.moveTo(X+5,k);g.lineTo(X+Wd-5,k);}
      g.stroke();
      g.strokeStyle='#4a5a68';g.lineWidth=7;g.beginPath();
      if(horiz){g.moveTo(X+8,cy-10);g.lineTo(X+Wd-8,cy-10);}else{g.moveTo(cx-10,Y+8);g.lineTo(cx-10,Y+Hd-8);}
      g.stroke();
      g.strokeStyle='#8a5a2a';g.lineWidth=4;g.beginPath();
      if(horiz){g.moveTo(X+8,cy+12);g.lineTo(X+Wd-8,cy+12);}else{g.moveTo(cx+12,Y+8);g.lineTo(cx+12,Y+Hd-8);}
      g.stroke();
    }else if(w.kind==='glass'){
      g.fillStyle='rgba(0,0,0,0.35)';g.fillRect(X+5,Y+7,Wd,Hd);
      g.fillStyle='#8a98a5';g.fillRect(X,Y,Wd,Hd);
      g.fillStyle='#0c151c';if(horiz)g.fillRect(X+8,Y+17,Wd-16,Hd-34);else g.fillRect(X+17,Y+8,Wd-34,Hd-16);
      g.fillStyle='rgba(110,215,245,0.42)';if(horiz)g.fillRect(X+8,Y+17,Wd-16,Hd-34);else g.fillRect(X+17,Y+8,Wd-34,Hd-16);
      g.fillStyle='rgba(255,255,255,0.4)';if(horiz)g.fillRect(X+8,Y+19,Wd-16,3);else g.fillRect(X+19,Y+8,3,Hd-16);
      g.fillStyle='#5c6a76';
      if(horiz)for(k=X;k<=X+Wd;k+=T)g.fillRect(k-4,Y,8,Hd);else for(k=Y;k<=Y+Hd;k+=T)g.fillRect(X,k-4,Wd,8);

function buildWave(n){
  var list=[],count=n===10?46:n>10?Math.min(95,50+(n-10)*5):10+n*6;
  for(var i=0;i<count;i++){
    var r=Math.random(),t='crawler';
    if(r<0.10)t=n>=7?'spitter':'crawler';
    else if(r<0.20)t=n>=5?'brute':'crawler';
    else if(r<0.32)t=n>=4?'exploder':'crawler';
    else if(r<0.44)t=n>=3?'flyer':'crawler';
    else if(r<0.68)t=n>=2?'runner':'crawler';
    list.push(t);
  }
  return list;
}

/* ---------- collision + pathing ---------- */
function collide(e,smash){
  var r=e.r;
  var x0=Math.max(0,Math.floor((e.x-r)/T)),x1=Math.min(MW-1,Math.floor((e.x+r)/T));
  var y0=Math.max(0,Math.floor((e.y-r)/T)),y1=Math.min(MH-1,Math.floor((e.y+r)/T));
  for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++){
    var s=solid[ty*MW+tx];if(!s)continue;
    var rx,ry,rw,rh;
    if(s===1){rx=tx*T;ry=ty*T;rw=T;rh=T;}
    else{var c=crateAt[ty*MW+tx];if(!c)continue;rx=c.x;ry=c.y;rw=c.w;rh=c.h;}
    var cx=clamp(e.x,rx,rx+rw),cy=clamp(e.y,ry,ry+rh),dx=e.x-cx,dy=e.y-cy,d2=dx*dx+dy*dy;
    if(d2<r*r){
      if(s===2&&smash){breakCrate(crateAt[ty*MW+tx]);continue;}
      if(d2>1e-6){var d=Math.sqrt(d2);e.x+=dx/d*(r-d);e.y+=dy/d*(r-d);}
      else{
        var l=e.x-rx,ri=rx+rw-e.x,t=e.y-ry,b=ry+rh-e.y,m=Math.min(l,ri,t,b);
        if(m===l)e.x=rx-r;else if(m===ri)e.x=rx+rw+r;else if(m===t)e.y=ry-r;else e.y=ry+rh+r;
      }
    }
  }
  e.x=clamp(e.x,T+r,WW-T-r);e.y=clamp(e.y,T+r,WH-T-r);
}
function computeFlow(){
  flow.fill(-1);
  var px=clamp(Math.floor(player.x/T),0,MW-1),py=clamp(Math.floor(player.y/T),0,MH-1);
  var h=0,t=0,i=py*MW+px;flow[i]=0;fq[t++]=i;
  while(h<t){
    i=fq[h++];var x=i%MW,y=(i-x)/MW,d=flow[i]+1,j;
    if(x>0){j=i-1;if(!solid[j]&&flow[j]<0){flow[j]=d;fq[t++]=j;}}
    if(x<MW-1){j=i+1;if(!solid[j]&&flow[j]<0){flow[j]=d;fq[t++]=j;}}
    if(y>0){j=i-MW;if(!solid[j]&&flow[j]<0){flow[j]=d;fq[t++]=j;}}
    if(y<MH-1){j=i+MW;if(!solid[j]&&flow[j]<0){flow[j]=d;fq[t++]=j;}}
  }
}
function steer(e){
  var tx=clamp(Math.floor(e.x/T),0,MW-1),ty=clamp(Math.floor(e.y/T),0,MH-1),d=flow[ty*MW+tx];
  var gx=player.x,gy=player.y;
  if(d>2){
    var best=d,bx=tx,by=ty;
    for(var oy=-1;oy<=1;oy++)for(var ox=-1;ox<=1;ox++){
      if(!ox&&!oy)continue;
      var nx=tx+ox,ny=ty+oy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      var fd=flow[ny*MW+nx];if(fd<0)continue;
      if(ox&&oy&&(flow[ty*MW+nx]<0||flow[ny*MW+tx]<0))continue;
      if(fd<best){best=fd;bx=nx;by=ny;}
    }
    gx=(bx+0.5)*T;gy=(by+0.5)*T;
  }
  return Math.atan2(gy-e.y,gx-e.x);
}

/* ---------- input ---------- */
window.addEventListener('keydown',function(e){
  var c=e.code;
  if(c==='Space'||c.indexOf('Arrow')===0||c==='Tab')e.preventDefault();
  if(e.repeat)return;
  keys[c]=true;audioInit();
  if(c==='KeyM'){muted=!muted;if(master)master.gain.value=muted?0:0.5;return;}
  if(state==='menu'){if(c==='Enter'||c==='Space')startGame();return;}
  if(state==='over'){if((c==='Enter'||c==='Space')&&stateT>0.8)startGame();return;}
  if(state==='win'){
    if(stateT<0.8)return;
    if(c==='Enter'){endless=true;state='play';stateT=0;between=true;clearT=0;shopOpen=true;}
    else if(c==='KeyR')startGame();
    return;
  }
  if(shopOpen){
    if(c==='KeyB'||c==='Escape')shopOpen=false;
    else if(c==='Enter')shopProceed();
    else if(/^(Digit|Numpad)[1-3]$/.test(c))buy(parseInt(c.slice(-1),10)-1);
    return;
  }
  if(c==='Escape'||c==='KeyP'){paused=!paused;return;}
  if(paused)return;
  if(c==='KeyB'){shopOpen=true;mouse.down=false;return;}
  if(c==='Enter'&&between&&clearT<=0){startWave(wave+1);return;}
  if(c==='Space'){doDash();return;}
  if(c==='KeyE'){toggleDual();return;}
  var m=/^(Digit|Numpad)([1-5])$/.exec(c);if(m)setWeapon(parseInt(m[2],10)-1);
});

/* ---------- update ---------- */
function update(){
  var i,j,e,b,p;
  // player
  var mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
  if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
  if(player.dashCd>0)player.dashCd-=DT;
  if(player.dash>0){
    player.dash-=DT;player.x+=player.dx*880*DT;player.y+=player.dy*880*DT;
    part(player.x,player.y,0,0,0.22,'#2ff5c0',16,1);part(player.x-player.dx*8,player.y-player.dy*8,0,0,0.16,'#9ffbe4',10,1);
  }else if(mx||my){var ml=Math.hypot(mx,my);player.x+=mx/ml*240*DT;player.y+=my/ml*240*DT;player.walk+=DT*12;}
  collide(player,false);
  if(comboT>0){comboT-=DT;if(comboT<=0)comboN=0;}
  if(player.hp<player.maxHp*0.3){hbT-=DT;if(hbT<=0){hbT=0.75;sfx('heart');}}
  for(i=booms.length-1;i>=0;i--){var bm=booms[i];bm.t-=DT;if(bm.t<=0){booms.splice(i,1);explode(bm.x,bm.y,bm.R,bm.dmg,bm.pdmg,bm.acidic);}}
  player.a=Math.atan2(mouse.y+cam.y-player.y,mouse.x+cam.x-player.x);
  if(player.cd>0)player.cd-=DT;if(player.inv>0)player.inv-=DT;if(player.flash>0)player.flash-=DT;
  if(mouse.down&&player.cd<=0)fire();

  flowT-=DT;if(flowT<=0){computeFlow();flowT=0.2;}

  // wave director
  if(!between){
    if(spawnQ.length){
      spawnT-=DT;
      if(spawnT<=0&&enemies.length<70){
        spawnT=Math.max(0.12,0.5-wave*0.035);
        var n=wave>=4?2:1;
        for(i=0;i<n&&spawnQ.length;i++){
          var v=pick(vents),tries=0;
          while(Math.hypot(v.x-player.x,v.y-player.y)<340&&tries++<8)v=pick(vents);
          spawnEnemy(spawnQ.pop(),v.x+rand(-18,18),v.y+rand(-18,18));
        }
      }
    }else if(enemies.length===0){
      between=true;
      if(wave===10&&!endless){clearT=2.6;banner.text='HIVE QUEEN DESTROYED';banner.sub='';banner.t=2.6;}
      else{
        var bonus=25+wave*10;credits+=bonus;earned+=bonus;clearT=1.6;
        banner.text='WAVE CLEARED';banner.sub='BONUS +'+bonus+' CREDITS';banner.t=1.6;sfx('clear');
      }
    }
  }else if(clearT>0){
    clearT-=DT;
    if(clearT<=0){
      if(wave===10&&!endless){state='win';stateT=0;mouse.down=false;sfx('win');saveBest();}
      else{shopOpen=true;mouse.down=false;}
    }
  }

  // enemies
  for(i=0;i<enemies.length;i++){
    e=enemies[i];if(e.dead)continue;
    e.ph+=DT*e.sp*0.09;if(e.flash>0)e.flash-=DT;if(e.atk>0)e.atk-=DT;
    var dx=player.x-e.x,dy=player.y-e.y,dist=Math.hypot(dx,dy)||1,sp=e.sp,toP=Math.atan2(dy,dx);
    var ang=e.type==='flyer'?toP+Math.sin(stateT*3+e.ph)*0.55:steer(e);
    e.near=dist<210;
    if(e.burn>0){
      e.burn-=DT;e.hp-=14*DT;
      if(Math.random()<0.3)part(e.x+rand(-e.r,e.r),e.y+rand(-e.r,e.r),rand(-20,20),rand(-70,-20),0.3,pick(['#ff9a2a','#ffd76a','#ff5a2a']),5,0.95);
      if(e.hp<=0){killEnemy(e,0,0);continue;}
    }
    if(e.type==='exploder'&&dist<e.r+player.r+16){killEnemy(e,0,0);continue;}
    if(e.type==='spitter'){
      e.sh-=DT;
      if(dist<300){ang=toP+(dist<190?Math.PI:Math.PI/2*e.side);sp*=0.6;}
      if(dist<480&&e.sh<=0){e.sh=rand(1.6,2.4);spit(e.x,e.y,toP,300,8);sfx('spit');}
    }else if(e.type==='queen'){
      var hk=e.hp/e.maxHp,phz=hk<0.3?3:hk<0.62?2:1,haste=phz===3?0.5:phz===2?0.72:1;
      if(phz!==e.phz){
        e.phz=phz;e.act=Math.min(e.act,0.5);shake(12);sfx('roar');
        banner.text=phz===3?'THE QUEEN IS ENRAGED':'THE QUEEN GROWS FURIOUS';banner.sub='';banner.t=2;
        burst(e.x,e.y,40,['#ff3a6a','#ffffff','#ff9ab0'],420,0.7,6);
      }
      sp=e.sp*(phz===3?1.5:phz===2?1.22:1);
      if(e.burn>0)e.hp+=10*DT;
      if(e.slamCd>0)e.slamCd-=DT;
      if(e.mode==='chase'){
        e.act-=DT;e.birth-=DT;
        if(e.birth<=0){
          e.birth=4.6*haste+1;
          if(enemies.length<62){
            var brood=phz===1?['crawler','crawler','runner']:phz===2?['runner','runner','exploder','crawler']:['runner','exploder','exploder','flyer','runner'];
            for(j=0;j<brood.length;j++)spawnEnemy(brood[j],e.x+rand(-34,34),e.y+rand(-34,34));
          }
        }
        if(dist<185&&e.slamCd<=0){e.mode='slamwind';e.mt=0.55;e.slamCd=3*haste+0.9;sfx('growl');}
        else if(e.act<=0){
          var roll=Math.random();
          if(roll<0.4&&dist<950){e.mode='wind';e.mt=0.5;e.ca=toP;e.chain=phz-1;sfx('roar');}
          else if(roll<0.72){
            for(j=0;j<18;j++)spit(e.x,e.y,toP+j*TAU/18,250,12);
            if(phz>=2)for(j=0;j<18;j++)spit(e.x,e.y,toP+(j+0.5)*TAU/18,340,12);
            for(j=-2;j<=2;j++)spit(e.x,e.y,toP+j*0.13,400,12);
            sfx('spit');e.act=rand(1.6,2.4)*haste;
          }else{e.mode='stream';e.mt=phz===3?2:1.5;e.sa=toP-0.9;e.st=0;}
        }
      }else if(e.mode==='wind'){sp=0;ang=e.ca;e.mt-=DT;e.x+=rand(-1.5,1.5);if(e.mt<=0){e.mode='charge';e.mt=0.7;}}
      else if(e.mode==='charge'){
        sp=650;ang=e.ca;e.a=e.ca;e.mt-=DT;e.trail-=DT;
        if(e.trail<=0){e.trail=0.07;spit(e.x,e.y,0,0,10,1.6);}
        if(e.mt<=0){
          if(e.chain>0){e.chain--;e.mode='wind';e.mt=0.28;e.ca=toP;}
          else{e.mode='chase';e.act=rand(1.5,2.3)*haste;}
        }
      }else if(e.mode==='slamwind'){
        sp=0;e.mt-=DT;
        if(e.mt<=0){
          e.mode='chase';e.act=Math.max(e.act,0.5);
          rings.push({x:e.x,y:e.y,r:200,life:0.4,max:0.4,col:'#ff3a6a'});shake(15);sfx('boom');
          burst(e.x,e.y,30,['#ff3a6a','#ffffff','#7af03c'],480,0.5,6);
          if(dist<205){hurt(26);player.x+=dx/dist*70;player.y+=dy/dist*70;}
        }
      }else{
        sp*=0.35;e.mt-=DT;e.st-=DT;
        if(e.st<=0){
          e.st=0.065;e.sa+=0.3;spit(e.x,e.y,e.sa,310,11);
          if(phz>=2)spit(e.x,e.y,e.sa+Math.PI,310,11);
          if(phz===3)spit(e.x,e.y,e.sa+Math.PI/2,260,11);
          sfx('spit');
        }
        if(e.mt<=0){e.mode='chase';e.act=rand(1.3,2)*haste;}
      }
    }
    var da=Math.atan2(Math.sin(ang-e.a),Math.cos(ang-e.a));
    e.a+=clamp(da,-DT*9,DT*9);
    e.x+=(Math.cos(e.a)*sp+e.kx)*DT;e.y+=(Math.sin(e.a)*sp+e.ky)*DT;
    e.kx*=0.85;e.ky*=0.85;
    if(e.type==='flyer'){e.x=clamp(e.x,T+e.r,WW-T-e.r);e.y=clamp(e.y,T+e.r,WH-T-e.r);}else collide(e,e.type==='queen');
    dx=e.x-player.x;dy=e.y-player.y;dist=Math.hypot(dx,dy)||1;
    var minD=e.r+player.r-2;
    if(dist<minD){
      if(e.type==='queen'){player.x-=dx/dist*(minD-dist);player.y-=dy/dist*(minD-dist);}
      else{e.x+=dx/dist*(minD-dist);e.y+=dy/dist*(minD-dist);}
    }
    if(e.dmg>0&&dist<e.r+player.r+4&&e.atk<=0){e.atk=0.7;hurt(e.dmg);}
  }
  // separation
  for(i=0;i<enemies.length;i++){
    var a=enemies[i];
    for(j=i+1;j<enemies.length;j++){
      var c=enemies[j],sx=c.x-a.x,sy=c.y-a.y,rr=(a.r+c.r)*0.85,d2=sx*sx+sy*sy;
      if(d2<rr*rr&&d2>0.01){
        var d=Math.sqrt(d2),ov=(rr-d)/d*0.5,wa=c.r/(a.r+c.r),wc=1-wa;
        a.x-=sx*ov*wa;a.y-=sy*ov*wa;c.x+=sx*ov*wc;c.y+=sy*ov*wc;
      }
    }
  }

  // bullets
  for(i=bullets.length-1;i>=0;i--){
    b=bullets[i];b.px=b.x;b.py=b.y;b.x+=b.vx*DT;b.y+=b.vy*DT;b.life-=DT;
    if(b.type==='flame'){b.vx*=0.94;b.vy*=0.94;}
    else if(b.type==='nade'){b.spin+=DT*14;if(Math.random()<0.5)part(b.x,b.y,0,0,0.25,'#8a9aa4',4,1);}
    var dead=b.life<=0,boom=dead&&b.type==='nade',tx=Math.floor(b.x/T),ty=Math.floor(b.y/T);
    var fr=b.type==='flame'?6+(1-b.life/b.max)*16:3;
    if(!dead){
      if(tx<0||ty<0||tx>=MW||ty>=MH)dead=true;
      else{
        var s=solid[ty*MW+tx];
        if(s===1){
          dead=true;
          if(b.type==='nade'){boom=true;b.x=b.px;b.y=b.py;}
          else if(b.type==='shot'){burst(b.px,b.py,3,'#ffd76a',160,0.2,2.5);sfx('wallhit');}
        }else if(s===2){
          var cr=crateAt[ty*MW+tx];
          if(cr&&b.x>=cr.x&&b.x<=cr.x+cr.w&&b.y>=cr.y&&b.y<=cr.y+cr.h){
            dead=true;
            if(b.type==='nade')boom=true;
            else{
              cr.hp-=b.type==='flame'?b.dmg*0.6:b.dmg;cr.hit=0.08;
              if(b.type==='shot')burst(b.x,b.y,2,cr.barrel?'#ff5a3a':'#cfd8de',140,0.25,3);
              if(cr.hp<=0)breakCrate(cr);
            }
          }
        }
      }
    }
    if(!dead){
      for(j=0;j<enemies.length;j++){
        e=enemies[j];if(e.dead)continue;
        var ex=e.x-b.x,ey=e.y-b.y,er=e.r+fr;
        if(ex*ex+ey*ey<er*er){
          var bl=Math.hypot(b.vx,b.vy)||1;
          if(b.type==='flame'){
            if(b.hits.indexOf(e)<0){b.hits.push(e);e.burn=2;hitEnemy(e,b.dmg,b.vx/bl,b.vy/bl,b.knock);}
          }else if(b.type==='nade'){dead=true;boom=true;break;}
          else{hitEnemy(e,b.dmg,b.vx/bl,b.vy/bl,b.knock);dead=true;break;}
        }
      }
    }
    if(dead){bullets.splice(i,1);if(boom)explode(b.x,b.y,b.R,b.dmg,12);}
  }
  // acid
  for(i=acid.length-1;i>=0;i--){
    p=acid[i];p.x+=p.vx*DT;p.y+=p.vy*DT;p.life-=DT;
    var kill=p.life<=0,ax=Math.floor(p.x/T),ay=Math.floor(p.y/T);
    if(!kill&&(ax<0||ay<0||ax>=MW||ay>=MH||solid[ay*MW+ax]===1))kill=true;
    if(!kill&&Math.hypot(p.x-player.x,p.y-player.y)<player.r+6){hurt(p.dmg);kill=true;}
    if(kill){burst(p.x,p.y,5,'#c8ff3a',120,0.3,3);acid.splice(i,1);}
  }
  if(enemies.length)enemies=enemies.filter(function(o){return !o.dead;});
  for(i=crates.length-1;i>=0;i--){
    var cc=crates[i];
    if(cc.fuse>0){cc.fuse-=DT;cc.hit=0.05;if(cc.fuse<=0)breakCrate(cc);}
    if(cc.dead)crates.splice(i,1);else if(cc.hit>0)cc.hit-=DT;
  }

  // pickups
  for(i=pickups.length-1;i>=0;i--){
    p=pickups[i];p.life-=DT;p.ph+=DT*5;
    var pdx=player.x-p.x,pdy=player.y-p.y,pd=Math.hypot(pdx,pdy)||1,want=true;
    if(p.type==='hp'&&player.hp>=player.maxHp)want=false;
    if(p.type==='am'&&!SHOP[0].can())want=false;
    if(want&&pd<120){p.x+=pdx/pd*430*DT;p.y+=pdy/pd*430*DT;}
    if(want&&pd<24){
      if(p.type==='cr'){credits+=p.val;earned+=p.val;floatTxt(p.x,p.y-12,'+'+p.val,'#5dff8a');sfx('pick');}
      else if(p.type==='hp'){player.hp=Math.min(player.maxHp,player.hp+25);floatTxt(p.x,p.y-12,'+25 HP','#ff7a7a');sfx('heal');}
      else{for(var q=1;q<5;q++)if(owned[q])ammo[q]=Math.min(WEAP[q].max,ammo[q]+WEAP[q].box);floatTxt(p.x,p.y-12,'+AMMO','#ffd76a');sfx('ammo');}
      pickups.splice(i,1);
    }else if(p.life<=0)pickups.splice(i,1);
  }
  updateFx();
  if(banner.t>0)banner.t-=DT;
  if(hurtT>0)hurtT-=DT;
}
function spit(x,y,a,sp,dmg,life){acid.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:life||2.6,dmg:dmg});}
function updateFx(){
  var i,p;
  for(i=parts.length-1;i>=0;i--){
    p=parts[i];p.x+=p.vx*DT;p.y+=p.vy*DT;p.vx*=p.fr;p.vy*=p.fr;p.life-=DT;
    if(p.life<=0)parts.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){p=floats[i];p.y-=34*DT;p.life-=DT;if(p.life<=0)floats.splice(i,1);}
  for(i=rings.length-1;i>=0;i--){rings[i].life-=DT;if(rings[i].life<=0)rings.splice(i,1);}
  shakeMag*=0.86;if(shakeMag<0.05)shakeMag=0;
}
function updateCamera(){
  var tx,ty;
  if(state==='menu'){tx=WW/2+Math.cos(stateT*0.13)*520-LW/2;ty=WH/2+Math.sin(stateT*0.17)*340-LH/2;}
  else{tx=player.x-LW/2+(mouse.x-LW/2)*0.2;ty=player.y-LH/2+(mouse.y-LH/2)*0.2;}
  cam.x+=(tx-cam.x)*0.14;cam.y+=(ty-cam.y)*0.14;
  if(LW>=WW)cam.x=(WW-LW)/2;else cam.x=clamp(cam.x,0,WW-LW);
  if(LH>=WH)cam.y=(WH-LH)/2;else cam.y=clamp(cam.y,0,WH-LH);
  cam.sx=(Math.random()-0.5)*2*shakeMag;cam.sy=(Math.random()-0.5)*2*shakeMag;
}
function step(){
  stateT+=DT;
  if(shopMsg.t>0)shopMsg.t-=DT;
  if(state==='play'){if(!paused&&!shopOpen)update();}
  else updateFx();
  if(!paused)updateCamera();
}

/* ---------- drawing ---------- */
var FONT='"Consolas","Lucida Console","Courier New",monospace';
var ACC='#2ff5c0';
function txt(s,x,y,size,col,align,weight){
  ctx.font=(weight||'bold')+' '+size+'px '+FONT;ctx.textAlign=align||'left';ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function panel(x,y,w,h,a){
  ctx.fillStyle='rgba(5,12,16,'+(a===undefined?0.72:a)+')';ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(47,245,192,0.55)';ctx.lineWidth=1.5;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
  ctx.fillStyle=ACC;ctx.fillRect(x,y,10,2);ctx.fillRect(x,y,2,10);ctx.fillRect(x+w-10,y+h-2,10,2);ctx.fillRect(x+w-2,y+h-10,2,10);
}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}
function onScreen(x,y,m){return x>cam.x-m&&x<cam.x+LW+m&&y>cam.y-m&&y<cam.y+LH+m;}

function legs(n,r,len,ph,col,lw){
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  for(var i=0;i<n;i++){
    var ox=(i-(n-1)/2)*r*1.5/n,sw=Math.sin(ph+i*1.9)*r*0.42;
    ctx.moveTo(ox,-r*0.3);ctx.lineTo(ox+sw*0.5-r*0.1,-r*len*0.6);ctx.lineTo(ox+sw+r*0.35,-r*len);
    ctx.moveTo(ox,r*0.3);ctx.lineTo(ox-sw*0.5-r*0.1,r*len*0.6);ctx.lineTo(ox-sw+r*0.35,r*len);
  }
  ctx.stroke();
}
function jaws(x,r,spread,reach,open,col,lw){
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(x,-r*spread);ctx.quadraticCurveTo(x+r*reach*0.8,-r*(spread+0.25+open*0.35),x+r*reach,-r*(0.04+open*0.3));
  ctx.moveTo(x,r*spread);ctx.quadraticCurveTo(x+r*reach*0.8,r*(spread+0.25+open*0.35),x+r*reach,r*(0.04+open*0.3));
  ctx.stroke();
}
function spikes(cx,cy,rx,ry,a0,a1,n,len,col){
  ctx.fillStyle=col;ctx.beginPath();
  for(var i=0;i<n;i++){
    var a=a0+(a1-a0)*i/(n-1),c=Math.cos(a),sn=Math.sin(a),bx=cx+c*rx,by=cy+sn*ry;
    ctx.moveTo(bx-sn*len*0.22,by+c*len*0.22);ctx.lineTo(bx+c*len,by+sn*len);ctx.lineTo(bx+sn*len*0.22,by-c*len*0.22);
  }
  ctx.fill();
}
function drawBug(e){
  var d=ET[e.type],r=e.r,fl=e.flash>0,i,ph=e.ph,open=0.5+0.5*Math.sin(ph*1.4);
  function C(c){return fl?'#ffffff':c;}
  ctx.save();ctx.translate(e.x,e.y);
  if(e.type==='flyer'){ctx.fillStyle='rgba(0,0,0,0.28)';ell(12,22,r*1.1,r*0.6);}
  else{ctx.fillStyle='rgba(0,0,0,0.34)';ell(3,5,r*1.15,r*0.95);}
  ctx.rotate(e.a);
  switch(e.type){
  case 'crawler':
    legs(4,r,1.85,ph,C(d.leg),Math.max(1.5,r*0.12));
    ctx.fillStyle=C(d.col);ell(-r*0.55,0,r*0.82,r*0.72);
    if(!fl){ctx.fillStyle='rgba(225,215,190,0.75)';ell(-r*0.6,0,r*0.3,r*0.36);
      ctx.fillStyle=d.col;ell(-r*0.5,-r*0.13,r*0.09,r*0.1);ell(-r*0.5,r*0.13,r*0.09,r*0.1);ctx.fillRect(-r*0.82,-r*0.03,r*0.2,r*0.06);}
    ctx.fillStyle=C(d.col2);ell(r*0.42,0,r*0.5,r*0.46);
    jaws(r*0.72,r,0.2,0.75,open,C('#e9dfc4'),Math.max(1.5,r*0.14));
    break;
  case 'runner':
    legs(3,r,1.35,ph,C(d.leg),Math.max(1.2,r*0.13));
    for(i=4;i>=0;i--){
      ctx.fillStyle=C(i%2?d.col:d.col2);
      ell(r*0.45-i*r*0.62,Math.sin(ph*0.8+i*0.9)*r*0.14*i,r*(0.66-i*0.1),r*(0.56-i*0.09));
    }
    ctx.strokeStyle=C('#f0e6d0');ctx.lineWidth=Math.max(1.2,r*0.16);ctx.lineCap='round';ctx.beginPath();
    var ty2=Math.sin(ph*0.8+4.5)*r*0.7;
    ctx.moveTo(-r*2.1,ty2*0.8);ctx.lineTo(-r*3.1,ty2*1.5);
    var sw=0.55+open*0.5;
    ctx.moveTo(r*0.5,-r*0.45);ctx.lineTo(r*1.25,-r*sw*1.25);ctx.lineTo(r*2.0,-r*0.12);
    ctx.moveTo(r*0.5,r*0.45);ctx.lineTo(r*1.25,r*sw*1.25);ctx.lineTo(r*2.0,r*0.12);
    ctx.stroke();
    break;
  case 'brute':
    legs(3,r,1.4,ph,C(d.leg),r*0.17);
    spikes(-r*0.2,0,r*0.98,r*0.84,Math.PI*0.42,Math.PI*1.58,9,r*0.42,C('#b9a9de'));
    ctx.fillStyle=C(d.col);ell(-r*0.2,0,r*1.0,r*0.86);
    if(!fl){
      ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=r*0.08;ctx.beginPath();
      ctx.moveTo(r*0.25,-r*0.78);ctx.quadraticCurveTo(-r*0.05,0,r*0.25,r*0.78);
      ctx.moveTo(-r*0.3,-r*0.84);ctx.quadraticCurveTo(-r*0.6,0,-r*0.3,r*0.84);ctx.stroke();
      ctx.strokeStyle='rgba(255,60,140,'+(0.35+0.3*Math.sin(stateT*5+ph))+')';ctx.lineWidth=r*0.07;ctx.beginPath();
      ctx.moveTo(-r*0.9,-r*0.1);ctx.lineTo(-r*0.5,r*0.12);ctx.lineTo(-r*0.15,-r*0.2);ctx.lineTo(r*0.2,r*0.05);
      ctx.moveTo(-r*0.5,r*0.12);ctx.lineTo(-r*0.6,r*0.5);ctx.stroke();
    }
    ctx.fillStyle=C(d.col2);ell(r*0.78,0,r*0.42,r*0.52);
    jaws(r*0.95,r,0.34,0.72,open,C('#e9dfc4'),r*0.2);
    break;
  case 'spitter':
    legs(3,r,1.45,ph,C(d.leg),Math.max(1.3,r*0.11));
    ctx.fillStyle=C(d.col);ell(r*0.1,0,r*0.72,r*0.52);
    var pu=0.5+0.5*Math.sin(stateT*4+ph);
    ctx.fillStyle=fl?'#fff':'rgba(150,255,50,'+(0.5+pu*0.25)+')';ell(-r*0.62,0,r*(0.86+pu*0.1),r*(0.8+pu*0.1));
    if(!fl){ctx.fillStyle='rgba(235,255,160,0.75)';ell(-r*0.8,-r*0.22,r*0.2,r*0.17);ell(-r*0.45,r*0.28,r*0.15,r*0.13);ell(-r*0.58,-r*0.05,r*0.1,r*0.1);
      ctx.strokeStyle='#31480f';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(-r*0.62,0,r*(0.86+pu*0.1),r*(0.8+pu*0.1),0,0,TAU);ctx.stroke();}
    ctx.fillStyle=C(d.col2);ell(r*0.75,0,r*0.42,r*0.3);
    ctx.fillStyle='#050805';ell(r*1.08,0,r*0.14,r*0.2);
    ctx.strokeStyle=C(d.col2);ctx.lineWidth=Math.max(1.3,r*0.1);ctx.beginPath();
    ctx.moveTo(r*0.65,-r*0.2);ctx.lineTo(r*0.9,-r*0.34);ctx.moveTo(r*0.65,r*0.2);ctx.lineTo(r*0.9,r*0.34);ctx.stroke();
    break;
  case 'exploder':
    legs(3,r,1.2,ph*1.3,C(d.leg),Math.max(1.3,r*0.12));
    var pe=0.5+0.5*Math.sin(stateT*(e.near?24:8)+ph),sr=r*(0.95+pe*0.16);
    ctx.fillStyle=fl?'#fff':'rgb('+Math.floor(150+pe*105)+','+Math.floor(50+pe*90)+',12)';ell(-r*0.12,0,sr,sr*0.94);
    if(!fl){
      ctx.strokeStyle='rgba(50,10,0,0.7)';ctx.lineWidth=1.4;ctx.beginPath();
      ctx.moveTo(-r*0.95,-r*0.1);ctx.quadraticCurveTo(-r*0.3,-r*0.5,r*0.5,-r*0.25);
      ctx.moveTo(-r*0.85,r*0.3);ctx.quadraticCurveTo(-r*0.1,r*0.55,r*0.55,r*0.2);
      ctx.moveTo(-r*0.3,-r*0.85);ctx.quadraticCurveTo(-r*0.1,0,-r*0.35,r*0.85);ctx.stroke();
      ctx.fillStyle='rgba(255,245,170,'+(0.25+pe*0.6)+')';ell(-r*0.15,0,sr*0.45,sr*0.42);
    }
    ctx.fillStyle=C(d.col2);ell(r*0.88,0,r*0.32,r*0.34);
    jaws(r*1.05,r,0.14,0.4,open,C('#e9dfc4'),Math.max(1.2,r*0.1));
    break;
  case 'flyer':
    var fs=0.35+0.65*Math.abs(Math.sin(stateT*26+ph));
    ctx.fillStyle=fl?'#fff':'rgba(120,215,255,0.26)';ctx.strokeStyle=fl?'#fff':'rgba(160,235,255,0.6)';ctx.lineWidth=1;
    for(i=-1;i<=1;i+=2){
      ctx.beginPath();ctx.moveTo(r*0.3,0);ctx.lineTo(r*0.9,i*r*1.5*fs);ctx.lineTo(-r*0.2,i*r*2.5*fs);ctx.lineTo(-r*1.1,i*r*1.3*fs);ctx.lineTo(-r*0.4,0);
      ctx.closePath();ctx.fill();ctx.stroke();
    }
    ctx.strokeStyle=C('#e9dfc4');ctx.lineWidth=Math.max(1.2,r*0.12);ctx.beginPath();ctx.moveTo(-r*0.9,0);ctx.lineTo(-r*1.9,Math.sin(stateT*9+ph)*r*0.3);ctx.stroke();
    ctx.fillStyle=C(d.col);ell(-r*0.2,0,r*0.95,r*0.36);
    ctx.fillStyle=C(d.col2);ell(r*0.62,0,r*0.44,r*0.4);
    jaws(r*0.9,r,0.16,0.5,open,C('#e9dfc4'),Math.max(1.2,r*0.11));
    break;
  case 'queen':
    legs(4,r,1.55,ph,C(d.leg),r*0.15);

    txt(banner.text,LW/2,LH*0.26,36,'#eafff8','center');
    ctx.shadowBlur=0;
    if(banner.sub)txt(banner.sub,LW/2,LH*0.26+34,15,'#5dff8a','center');
    ctx.globalAlpha=1;
  }
  if(between&&clearT<=0&&!shopOpen){
    ctx.globalAlpha=0.6+0.4*Math.sin(stateT*5);
    txt('ENTER - DEPLOY WAVE '+(wave+1)+'     B - ARMORY',LW/2,LH-126,16,'#eafff8','center');
    ctx.globalAlpha=1;
  }
  if(muted)txt('MUTED (M)',LW/2,LH-16,11,'#7f97a3','center');
}
function shopBtn(r,label,right,dim,hov){
  ctx.fillStyle=hov&&!dim?'rgba(47,245,192,0.2)':'rgba(255,255,255,0.045)';ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.strokeStyle=hov?ACC:'rgba(120,150,165,0.35)';ctx.lineWidth=1;ctx.strokeRect(r.x+0.5,r.y+0.5,r.w-1,r.h-1);
  txt(label,r.x+10,r.y+r.h/2,12,dim?'#6f8089':'#eafff8');
  txt(right.t,r.x+r.w-10,r.y+r.h/2,12,right.c,'right');
}
function drawShop(){
  ctx.fillStyle='rgba(2,6,10,0.72)';ctx.fillRect(0,0,LW,LH);
  var L=shopLayout(),i;
  panel(L.x,L.y,L.w,L.h,0.94);
  txt('ARMORY',L.x+22,L.y+32,28,ACC);
  txt('CREDITS: '+credits,L.x+L.w-22,L.y+32,18,'#5dff8a','right');
  txt(shopMsg.t>0?shopMsg.text:'Click to buy. Keys 1-3 buy supplies.',L.x+22,L.y+64,12,shopMsg.t>0?'#ffd76a':'#7f97a3',null,'normal');
  for(i=0;i<SHOP.length;i++){
    var it=SHOP[i],r=L.rows[i],c=it.cost(),ok=it.can(),aff=credits>=c,hov=inRect(r,mouse.x,mouse.y),dim=!ok||!aff;
    ctx.fillStyle=hov&&!dim?'rgba(47,245,192,0.2)':'rgba(255,255,255,0.045)';ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeStyle=hov?ACC:'rgba(120,150,165,0.35)';ctx.lineWidth=1;ctx.strokeRect(r.x+0.5,r.y+0.5,r.w-1,r.h-1);
    txt(String(i+1),r.x+14,r.y+20,17,dim?'#55656e':ACC);
    txt(it.name+(it.lvl()?'  ['+it.lvl()+']':''),r.x+40,r.y+13,14,dim?'#6f8089':'#eafff8');
    txt(it.desc,r.x+40,r.y+29,10,'#7f97a3',null,'normal');
    txt(ok?c+' CR':(it.lvl()?'MAXED':'FULL'),r.x+r.w-14,r.y+20,15,!ok?'#55656e':aff?'#5dff8a':'#ff6a5a','right');
  }
  txt('WEAPON UPGRADES',L.x+22,L.wy-16,13,ACC);
  for(i=0;i<5;i++){
    var y=L.wy+i*44;
    txt((i+1)+'  '+WEAP[i].name,L.x+22,y+13,14,owned[i]?'#eafff8':'#6f8089');
    txt(!owned[i]?'locked':ammo[i]===Infinity?'ammo: infinite':'ammo: '+ammo[i]+' / '+WEAP[i].max,L.x+40,y+29,10,'#7f97a3',null,'normal');
  }
  for(i=0;i<L.wb.length;i++){
    var b2=L.wb[i],inf=wInfo(b2.wi,b2.kind),af=credits>=inf.cost;
    shopBtn(b2,inf.label,{t:inf.ok?inf.cost+' CR':'MAX',c:!inf.ok?'#55656e':af?'#5dff8a':'#ff6a5a'},!inf.ok||!af,inRect(b2,mouse.x,mouse.y));
  }
  var b=L.btn,bh=inRect(b,mouse.x,mouse.y),can=between&&clearT<=0;
  ctx.fillStyle=bh?'#2ff5c0':'rgba(47,245,192,0.78)';ctx.fillRect(b.x,b.y,b.w,b.h);
  txt(can?'DEPLOY - WAVE '+(wave+1):'RESUME',b.x+b.w/2,b.y+b.h/2+1,19,'#03130f','center');
  txt(can?'ENTER to deploy   -   B to close and look around':'B to close',L.x+L.w/2,L.y+L.h-12,10,'#7f97a3','center','normal');
}
function drawCrosshair(){
  var x=mouse.x,y=mouse.y,menuLike=state!=='play'||shopOpen||paused;
  ctx.strokeStyle=menuLike?'#eafff8':ACC;ctx.lineWidth=2;ctx.beginPath();
  if(menuLike){ctx.moveTo(x-8,y);ctx.lineTo(x+8,y);ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);}
  else{
    var g=6+(player.cd>0?4:0);
    ctx.moveTo(x-g-8,y);ctx.lineTo(x-g,y);ctx.moveTo(x+g,y);ctx.lineTo(x+g+8,y);
    ctx.moveTo(x,y-g-8);ctx.lineTo(x,y-g);ctx.moveTo(x,y+g);ctx.lineTo(x,y+g+8);
  }
  ctx.stroke();
  if(!menuLike){ctx.fillStyle='#fff';ctx.fillRect(x-1,y-1,2,2);}
}
function drawTitle(big,sub,col){
  ctx.shadowColor=col;ctx.shadowBlur=28;
  var size=Math.min(84,LW/9);
  txt(big,LW/2,LH*0.24,size,'#f2fffb','center');
  ctx.shadowBlur=0;
  txt(sub,LW/2,LH*0.24+size*0.72,16,col,'center');
}
function drawMenu(){
  ctx.fillStyle='rgba(2,6,10,0.6)';ctx.fillRect(0,0,LW,LH);
  drawTitle('HIVE BREACH','SUBLEVEL 9 CONTAINMENT FAILURE','#5dff3a');
  var y=LH*0.24+96,lines=[
    ['W A S D','MOVE'],['MOUSE','AIM'],['HOLD LEFT CLICK','FIRE'],['SPACE','DASH / DODGE'],['E','DUAL OR SINGLE PISTOL'],
    ['1 - 5  OR  SCROLL','SWITCH WEAPON'],['B','ARMORY (SHOP)'],['ESC / P','PAUSE'],['M','MUTE']];
  panel(LW/2-230,y-22,460,lines.length*26+22,0.8);
  for(var i=0;i<lines.length;i++){
    txt(lines[i][0],LW/2-14,y+i*26,14,ACC,'right');
    txt(lines[i][1],LW/2+14,y+i*26,14,'#d7e6ec','left','normal');
  }
  var yy=y+lines.length*26+40;
  txt('Survive 10 waves. Kill the Hive Queen. Then see how long you last.'+(best?'   BEST SCORE '+best:''),LW/2,yy,14,'#9fb8c4','center','normal');
  ctx.globalAlpha=0.55+0.45*Math.sin(stateT*4);
  txt('CLICK OR PRESS ENTER TO DEPLOY',LW/2,yy+38,22,'#eafff8','center');
  ctx.globalAlpha=1;
  txt('v1.2',LW-16,LH-16,11,'#55656e','right','normal');
}
function drawEnd(win){
  ctx.fillStyle=win?'rgba(2,14,10,0.74)':'rgba(20,2,2,0.74)';ctx.fillRect(0,0,LW,LH);
  drawTitle(win?'FACILITY SECURED':'YOU DIED',win?'THE HIVE QUEEN IS DEAD':'THE SWARM OVERRAN SUBLEVEL 9',win?'#5dff3a':'#ff5a5a');
  var y=LH*0.24+130;
  panel(LW/2-200,y-30,400,148,0.85);
  txt('REACHED WAVE',LW/2-14,y,15,'#9fb8c4','right','normal');txt(endless?String(wave):wave+' / 10',LW/2+14,y,15,'#eafff8');
  txt('KILLS',LW/2-14,y+30,15,'#9fb8c4','right','normal');txt(String(kills),LW/2+14,y+30,15,'#eafff8');
  txt('SCORE',LW/2-14,y+60,15,'#9fb8c4','right','normal');txt(String(score),LW/2+14,y+60,15,'#ffd76a');
  txt('BEST',LW/2-14,y+90,15,'#9fb8c4','right','normal');txt(String(best),LW/2+14,y+90,15,'#5dff8a');
  if(stateT>0.8){
    ctx.globalAlpha=0.55+0.45*Math.sin(stateT*4);
    txt(win?'ENTER - CONTINUE INTO ENDLESS MODE':'PRESS ENTER TO RETRY',LW/2,y+166,22,'#eafff8','center');
    ctx.globalAlpha=1;
    if(win)txt('R - START A NEW RUN',LW/2,y+198,14,'#9fb8c4','center');
  }
}
function draw(){
  ctx.setTransform(DPR*S,0,0,DPR*S,0,0);
  ctx.fillStyle='#05070a';ctx.fillRect(0,0,LW,LH);
  ctx.textBaseline='middle';
  drawWorld();
  if(state==='menu')drawMenu();
  else{
    if(state==='play')drawHUD();
    if(shopOpen)drawShop();
    else if(paused){
      ctx.fillStyle='rgba(2,6,10,0.7)';ctx.fillRect(0,0,LW,LH);
      ctx.shadowColor=ACC;ctx.shadowBlur=22;txt('PAUSED',LW/2,LH*0.42,64,'#f2fffb','center');ctx.shadowBlur=0;
      txt('ESC TO RESUME',LW/2,LH*0.42+56,18,ACC,'center');
    }
    if(state==='over')drawEnd(false);else if(state==='win')drawEnd(true);
  }
  drawCrosshair();
}

/* ---------- main loop ---------- */
var lastT=0,acc=0;
function frame(t){
  requestAnimationFrame(frame);
  var d=(t-lastT)/1000;lastT=t;
  if(!(d>0))d=0;if(d>0.1)d=0.1;
  acc+=d;var n=0;
  while(acc>=DT&&n<5){step();acc-=DT;n++;}
  if(n===5)acc=0;
  draw();
}
bakeFloor();bakeMini();resetGame();state='menu';
window.__hb={get state(){return state;},get wave(){return wave;},get player(){return player;},get enemies(){return enemies;},mouse:mouse,keys:keys,get shopOpen(){return shopOpen;},get credits(){return credits;},set credits(v){credits=v;},buy:buy,buyW:buyW,get owned(){return owned;},get ammo(){return ammo;},get crates(){return crates;},get score(){return score;},get cam(){return cam;}};
requestAnimationFrame(frame);
})();
</script>
